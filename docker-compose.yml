
services:
  sksystem-bot:
    build: .
    container_name: sksystem-bot
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data

  sksystem-web:
    build: .
    container_name: sksystem-web
    restart: unless-stopped
    env_file: .env
    ports:
      - "9003:9000"
    volumes:
      - ./data:/app/data
    command: uvicorn app.web:app --host 0.0.0.0 --port 9000
